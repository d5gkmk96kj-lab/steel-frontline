、name: Build Windows Rework

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read version
        id: ver
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -c "import json;d=json.load(open('version.json',encoding='utf-8'));print('version='+d['version']);print('label='+d.get('label',d['version']))" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PyQt6

      - name: Run test suite
        run: |
          python -m unittest discover -s tests -v --pattern "test_*.py" -k "not test_updater"

      - name: Build icon
        run: python packaging/make_icon.py

      - name: Build with PyInstaller
        shell: python
        run: |
          import subprocess, sys, os

          NAME = "SteelFrontlineWindowsRework"
          ROOT = os.path.abspath(".")
          hidden = [
              "core", "core.run", "core.cards", "core.enemies", "core.engine",
              "core.versus", "core.netplay", "core.saves", "core.session",
              "core.reconnect", "core.relay_client", "core.updater",
              "core.cleanup", "core.tips", "core.audio", "core.i18n",
              "core.version", "core.cheats", "core.deckbuild",
              "qt", "qt.qapp", "qt.qscreens", "qt.qbattle", "qt.qversus",
              "qt.qlobby", "qt.qdeckbuild", "qt.qsave", "qt.qupdate",
              "qt.qcleanup", "qt.qconsole", "qt.qfx", "qt.qmap",
              "qt.qtheme", "qt.qwidgets",
          ]
          cmd = [sys.executable, "-m", "PyInstaller",
                 "--noconfirm", "--clean", "--windowed",
                 "--name", NAME,
                 "--distpath", "dist_win",
                 "--workpath", "build_win",
                 "--specpath", "build_win",
                 "--paths", ".",
                 "--add-data", f"{ROOT}/locales;locales",
                 "--add-data", f"{ROOT}/tips.txt;.",
                 "--icon", "packaging/icon.ico"]
          for h in hidden:
              cmd += ["--hidden-import", h]
          cmd.append("packaging/app_entry.py")

          print("running:", " ".join(cmd[:8]), "...")
          r = subprocess.run(cmd)
          sys.exit(r.returncode)

      - name: Verify the exe runs
        shell: pwsh
        run: |
          $exe = "dist_win\SteelFrontlineWindowsRework\SteelFrontlineWindowsRework.exe"
          if (-not (Test-Path $exe)) { throw "exe not found: $exe" }
          Write-Host "exe size: $((Get-Item $exe).Length) bytes"
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:SF_GAME_HOME = "$env:TEMP\sftest"
          New-Item -ItemType Directory -Force -Path $env:SF_GAME_HOME | Out-Null
          & $exe --selftest
          $code = $LASTEXITCODE
          Write-Host "selftest exit code: $code"
          if ($code -ne 0) { throw "selftest failed with $code" }
          Write-Host "selftest passed"

      - name: Assemble release folder
        shell: pwsh
        run: |
          $name = "SteelFrontlineWindowsRework"
          $ver = "${{ steps.ver.outputs.version }}"
          $out = "release/SteelFrontline-WindowsRework-$ver"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Copy-Item -Recurse "dist_win/$name" "$out/$name"
          if (Test-Path "tips.txt")  { Copy-Item "tips.txt"  "$out/" }
          if (Test-Path "README.md") { Copy-Item "README.md" "$out/游戏教程.md" }
          New-Item -ItemType Directory -Force -Path "$out/music" | Out-Null
          New-Item -ItemType Directory -Force -Path "$out/data"  | Out-Null

          $L = @()
          $L += "============================================================"
          $L += " 钢铁战线 Steel Frontline - Windows Rework"
          $L += " Version: $ver"
          $L += "============================================================"
          $L += ""
          $L += "How to run:"
          $L += "  1. Double-click $name.exe"
          $L += "  2. If Windows SmartScreen appears, click More info - Run anyway."
          $L += "  3. First launch may take 5-10 seconds."
          $L += ""
          $L += "Saves:  %APPDATA%\钢铁战线\data\"
          $L += "Music:  drop files into music\ as music1.mp3, music2.ogg, ..."
          $L += ""
          $L += " ⚠️ 本游戏全部由 AI（DeepSeek-V4.1-Flash）生成 ⚠️"
          $L += " This game is entirely AI-generated."
          $L += "============================================================"
          $L | Set-Content -Path "$out/README-FIRST.txt" -Encoding UTF8

          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip" -Force
          Write-Host "created $out.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteelFrontline-WindowsRework-${{ steps.ver.outputs.version }}
          path: release/*.zip
          retention-days: 90

      - name: Attach to Release (only on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          name: ${{ steps.ver.outputs.label }}
          generate_release_notes: true
