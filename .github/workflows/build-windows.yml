name: Build Windows Rework

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read version
        id: ver
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -c "import json;d=json.load(open('version.json',encoding='utf-8'));print('version='+d['version']);print('label='+d.get('label',d['version']))" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PyQt6

      - name: Run test suite
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        # 用专门的运行器：unittest 默认的失败摘要会被各测试的 print
        # 淹没，在 CI 日志里根本找不到到底哪个用例挂了。
        # 这个运行器最后会单独打一份「失败清单」并加 ::error:: 标记。
        run: |
          python .github/test_runner.py

      - name: Build icon
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -e
          python packaging/make_icon.py
          ls -la packaging/icon.ico

      - name: Build with PyInstaller
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        # 参数交给独立的 Python 脚本生成，不在 YAML 里拼长命令行。
        # 关键：**不要传 --specpath** —— 那会让 --add-data / --icon 的
        # 相对路径基于 spec 目录解析，报 "icon.ico not found"（踩过）。
        # 全部路径一律用绝对路径，最保险。
        run: |
          set -e
          python .github/build_windows.py

      - name: Verify the exe exists
        shell: bash
        run: |
          set -e
          EXE="dist_win/SteelFrontlineWindowsRework/SteelFrontlineWindowsRework.exe"
          if [ ! -f "$EXE" ]; then
            echo "::error::exe not found: $EXE"
            ls -R dist_win 2>/dev/null | head -60
            exit 1
          fi
          ls -la "$EXE"

      - name: Run the exe selftest
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -e
          EXE="dist_win/SteelFrontlineWindowsRework/SteelFrontlineWindowsRework.exe"
          export QT_QPA_PLATFORM=offscreen
          export SF_GAME_HOME="$RUNNER_TEMP/sftest"
          mkdir -p "$SF_GAME_HOME"
          WEXE=$(cygpath -w "$EXE")
          echo "running: $WEXE --selftest"
          cmd //c ""$WEXE" --selftest"
          echo "selftest passed"

      - name: Assemble release folder
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          set -e
          NAME="SteelFrontlineWindowsRework"
          VER="${{ steps.ver.outputs.version }}"
          OUT="release/SteelFrontline-WindowsRework-$VER"

          rm -rf release
          mkdir -p "$OUT"
          cp -r "dist_win/$NAME" "$OUT/$NAME"
          if [ -f tips.txt ]; then cp tips.txt "$OUT/"; fi
          if [ -f README.md ]; then cp README.md "$OUT/游戏教程.md"; fi
          mkdir -p "$OUT/music" "$OUT/data"

          NAME="$NAME" VER="$VER" OUT="$OUT" python .github/make_readme.py

          cd release
          python -c "import shutil; shutil.make_archive('SteelFrontline-WindowsRework-$VER', 'zip', '.', 'SteelFrontline-WindowsRework-$VER')"
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteelFrontline-WindowsRework-${{ steps.ver.outputs.version }}
          path: release/*.zip
          retention-days: 90

      - name: Attach to Release (only on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          name: ${{ steps.ver.outputs.label }}
          generate_release_notes: true
